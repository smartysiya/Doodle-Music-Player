name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Build and test the React Frontend
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: doodle-music-player/package-lock.json

      - name: Install dependencies
        run: |
          cd doodle-music-player
          npm ci

      - name: Lint code
        run: |
          cd doodle-music-player
          npm run lint

      - name: Build frontend
        run: |
          cd doodle-music-player
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.example.com' }}

  # Job 2: Build and test the Express Backend
  backend-ci:
    name: Backend CI (Express.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      # Uncomment below once you add tests to your server's package.json
      # - name: Run tests
      #   run: |
      #     cd server
      #     npm test
